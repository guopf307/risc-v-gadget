---
name: ubuntu-server-riscv64-preinstalled
display-name: Ubuntu Server RISC-V preinstalled
revision: 1
architecture: riscv64
series: noble
class: preinstalled
kernel: linux-eic7700
gadget:
  url: "https://github.com/guopf307/risc-v-gadget"
  type: "git"
  branch: "ubuntu-p550"
rootfs:
  archive: ubuntu
  sources-list-deb822: true
  components:
    - main
    - restricted
    - universe
    - multiverse
  mirror: "https://ports.ubuntu.com/ubuntu-ports/"
  pocket: updates
  seed:
    urls:
      # Vcs: https://git.launchpad.net/~ubuntu-core-dev/ubuntu-seeds/+git/ubuntu
      - "https://git.launchpad.net/~ubuntu-core-dev/ubuntu-seeds/+git/"
    branch: noble
    names:
      - cloud-image
      - server
      - minimal
      - standard
customization:
  extra-ppas:
    - name: eswincomputing/noble-eic7700
      fingerprint: 5F1BB31B87A6D34CB7A509512672395EA9419D21
  cloud-init:
    user-data: |
      #cloud-config
      chpasswd:
        expire: true
        users:
          - name: ubuntu
            password: ubuntu
            type: text
      runcmd:
        - sed -i 's|#[[:space:]]*WaylandEnable[[:space:]]*=.*|WaylandEnable=false|' /etc/gdm3/custom.conf
  extra-packages:
    - name: "flash-kernel"
    - name: "grub-efi-riscv64"
    - name: "es-bmcd"
    - name: "eswin-eic7x-gpu"
    - name: "ubuntu-desktop"
    - name: "libegl-mesa0"
    - name: "libegl1-mesa"
    - name: "libgbm1"
    - name: "libgl1-mesa-dri"
    - name: "libgl1-mesa-glx"
    - name: "libglapi-mesa"
    - name: "libgles2-mesa"
    - name: "libglx-mesa0"
    - name: "libosmesa6"
    - name: "libwayland-egl1-mesa"
    - name: "mesa-opencl-icd"
    - name: "mesa-va-drivers"
    - name: "mesa-vdpau-drivers"
    - name: "mesa-vulkan-drivers"
  extra-snaps:
    - name: snapd
  deb-packages:
    - path: ./deb-packages/rtsp-simple-server_0.0.1_riscv64.deb
  fstab:
    - label: "writable"
      mountpoint: "/"
      filesystem-type: "ext4"
      dump: false
      fsck-order: 1
    - label: "esp"
      mountpoint: "/boot/efi"
      filesystem-type: "vfat"
      mount-options: "defaults"
      dump: false
      fsck-order: 1
  manual:
    make-dirs:
      - path: /etc/default/grub.d
        permissions: 0755
      - path: /boot/efi
        permissions: 0755
      - path: /etc/flash-kernel
        permissions: 0755
      - path: /etc/apt/preferences.d
        permissions: 0755
    copy-file:
      - destination: /etc/default/grub.d/zz_p550.cfg
        source: grub/zz_p550.cfg
      - destination: /etc/flash-kernel/db
        source: flash-kernel/db
      - destination: /etc/flash-kernel/machine
        source: flash-kernel/machine
      - destination: /tmp/customize.sh
        source: customize.sh
      - destination: /etc/apt/preferences.d
        source: pin_sifive_ppa
    execute:
      - path: /tmp/customize.sh
artifacts:
  img:
    - name: ubuntu-24.04-preinstalled-server-riscv64.img
  manifest:
    name: ubuntu-24.04-preinstalled-server-riscv64.manifest
